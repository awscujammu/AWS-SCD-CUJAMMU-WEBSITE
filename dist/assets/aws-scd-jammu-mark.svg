<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AWS Student Community Day Jammu mark</title>
  <desc id="desc">Three nested golden architectural arches forming a geometric emblem.</desc>
  <defs>
