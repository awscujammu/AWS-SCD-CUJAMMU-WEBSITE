      <stop offset="0" stop-color="#FFF0B5"/>
      <stop offset="0.42" stop-color="#EBC66E"/>
      <stop offset="1" stop-color="#A97825"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
